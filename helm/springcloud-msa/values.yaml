global:
  imagePullSecrets: []

namespace:
  create: false
  name: springcloud-msa

eureka:
  replicaCount: 1
  image:
    repository: eureka-server
    tag: latest
    pullPolicy: IfNotPresent
  service:
    name: eureka-service
    type: ClusterIP
    port: 8761
  javaOpts: "-Xms256m -Xmx512m"
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

configServer:
  replicaCount: 1
  image:
    repository: config-service
    tag: latest
    pullPolicy: IfNotPresent
  service:
    name: config-service
    type: ClusterIP
    port: 8888
  env:
    gitUri: https://github.com/maosella/springcloudMSA
    gitSearchPaths: microservices-config
  javaOpts: "-Xms256m -Xmx512m"
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

movieService:
  replicaCount: 1
  image:
    repository: movie-service
    tag: latest
    pullPolicy: IfNotPresent
  service:
    name: movie-service
    type: ClusterIP
    port: 8082
  javaOpts: "-Xms256m -Xmx512m"
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

catalogService:
  replicaCount: 1
  image:
    repository: catalog-service
    tag: latest
    pullPolicy: IfNotPresent
  service:
    name: catalog-service
    type: ClusterIP
    port: 8084
  javaOpts: "-Xms256m -Xmx512m"
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

seriesService:
  replicaCount: 1
  image:
    repository: series-service
    tag: latest
    pullPolicy: IfNotPresent
  service:
    name: series-service
    type: ClusterIP
    port: 8086
  javaOpts: "-Xms256m -Xmx512m"
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

apiGateway:
  replicaCount: 1
  image:
    repository: api-gateway
    tag: latest
    pullPolicy: IfNotPresent
  service:
    name: api-gateway
    type: LoadBalancer
    port: 80
    targetPort: 8080
  javaOpts: "-Xms256m -Xmx512m"
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

rabbitmq:
  replicaCount: 1
  image:
    repository: rabbitmq
    tag: 3.7.2-management
    pullPolicy: IfNotPresent
  service:
    name: rabbitmq
    type: ClusterIP
    ports:
      amqp: 5672
      management: 15672
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

zipkin:
  replicaCount: 1
  image:
    repository: openzipkin/zipkin
    tag: latest
    pullPolicy: IfNotPresent
  service:
    name: zipkin
    type: ClusterIP
    port: 9411
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

mongodb:
  replicaCount: 1
  image:
    repository: mongo
    tag: 5.0
    pullPolicy: IfNotPresent
  service:
    name: mongodb
    type: ClusterIP
    port: 27017
  auth:
    enabled: true
    rootUsername: rootuser
    rootPassword: rootpass
    database: tp_final
  persistence:
    enabled: true
    accessModes:
      - ReadWriteOnce
    size: 10Gi
    storageClassName: gp2
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

mongoExpress:
  enabled: true
  replicaCount: 1
  image:
    repository: mongo-express
    tag: latest
    pullPolicy: IfNotPresent
  service:
    name: mongo-express
    type: ClusterIP
    port: 8081
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

mysql:
  replicaCount: 1
  image:
    repository: mysql
    tag: 8.0
    pullPolicy: IfNotPresent
  service:
    name: mysql
    type: ClusterIP
    port: 3306
  auth:
    rootPassword: rootpass
    username: user
    password: pass
    database: tp_final
  persistence:
    enabled: true
    accessModes:
      - ReadWriteOnce
    size: 10Gi
    storageClassName: gp2
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
