{{- if .Values.mongodb.auth.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-auth
  labels:
    app: mongodb
    {{- include "springcloud-msa.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.mongodb.auth.rootUsername | quote }}
  password: {{ .Values.mongodb.auth.rootPassword | quote }}
  database: {{ .Values.mongodb.auth.database | quote }}
---
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  labels:
    app: mongodb
    {{- include "springcloud-msa.labels" . | nindent 4 }}
spec:
  serviceName: {{ .Values.mongodb.service.name }}
  replicas: {{ .Values.mongodb.replicaCount }}
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
        {{- include "springcloud-msa.standardLabels" . | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | indent 8 }}
      {{- end }}
      containers:
        - name: mongodb
          image: "{{ .Values.mongodb.image.repository }}:{{ .Values.mongodb.image.tag }}"
          imagePullPolicy: {{ .Values.mongodb.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.mongodb.service.port }}
              name: mongo
          env:
            {{- if .Values.mongodb.auth.enabled }}
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongodb-auth
                  key: username
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-auth
                  key: password
            - name: MONGO_INITDB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: mongodb-auth
                  key: database
            {{- end }}
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
          resources:
{{ toYaml .Values.mongodb.resources | indent 12 }}
      {{- if .Values.mongodb.nodeSelector }}
      nodeSelector:
{{ toYaml .Values.mongodb.nodeSelector | indent 8 }}
      {{- end }}
      {{- if .Values.mongodb.affinity }}
      affinity:
{{ toYaml .Values.mongodb.affinity | indent 8 }}
      {{- end }}
      {{- if .Values.mongodb.tolerations }}
      tolerations:
{{ toYaml .Values.mongodb.tolerations | indent 8 }}
      {{- end }}
{{- if .Values.mongodb.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: mongodb-data
        labels:
          app: mongodb
      spec:
        accessModes:
{{ toYaml .Values.mongodb.persistence.accessModes | indent 10 }}
        resources:
          requests:
            storage: {{ .Values.mongodb.persistence.size }}
        {{- if .Values.mongodb.persistence.storageClassName }}
        storageClassName: {{ .Values.mongodb.persistence.storageClassName }}
        {{- end }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.mongodb.service.name }}
  labels:
    app: mongodb
    {{- include "springcloud-msa.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app: mongodb
  ports:
    - port: {{ .Values.mongodb.service.port }}
      targetPort: mongo
      name: mongo
